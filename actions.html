<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Actions</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0}
    header{background:#264653;color:#fff;padding:12px}
    main{padding:16px}
    .card{border:1px solid #ddd;padding:12px;margin:8px 0;border-radius:6px}
    input,select{width:100%;padding:8px;margin:6px 0}
    button{padding:8px 12px;background:#2a9d8f;color:#fff;border:0;border-radius:4px}
    pre{background:#f4f4f4;padding:8px}
  </style>
</head>
<body>
<header><h2 style="margin:0">Actions</h2></header>
<main>
  <section class="card">
    <label>Plan ID <input id="planId"></label>
    <button id="loadActions">Load Action IDs From Plan</button>
    <pre id="planActionsView"></pre>
  </section>

  <section class="card">
    <label>Action ID <input id="actionId"></label>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button id="submitForApproval" style="background:#e76f51">Submit For Approval</button>
      <button id="approve" style="background:#2a9d8f">Approve</button>
      <button id="reject" style="background:#f4a261">Reject</button>
      <button id="suspend" style="background:#e76f51">Suspend</button>
      <button id="resume" style="background:#2a9d8f">Resume</button>
      <button id="complete" style="background:#06a77d">Complete</button>
      <button id="reopen" style="background:#d62828">Reopen</button>
      <button id="abandon" style="background:#666">Abandon</button>
    </div>
    <div id="transitionResult"></div>
  </section>

  <section class="card">
    <label>Action ID <input id="allocActionId"></label>
    <label>ResourceType ID <input id="resType"></label>
    <label>Quantity <input id="qty" type="number" step="0.01"></label>
    <label>Kind <select id="allocKind"><option value="GENERAL">GENERAL</option><option value="SPECIFIC">SPECIFIC</option></select></label>
    <label>Asset ID (optional) <input id="assetId"></label>
    <label>Time Period Start (optional) <input id="periodStart" type="date"></label>
    <label>Time Period End (optional) <input id="periodEnd" type="date"></label>
    <button id="addAlloc">Add Allocation</button>
    <div id="allocResult"></div>
  </section>

  <a href="index.html">Back</a>
</main>
<script>
  const API_BASE = 'https://resource-planning-part1-latest.onrender.com';

  function collectActionIds(node, results = []) {
    if (node && node.type === 'LEAF') {
      results.push({ id: node.id, name: node.name, status: node.status });
    }
    (node.children || []).forEach(child => collectActionIds(child, results));
    return results;
  }

  document.getElementById('loadActions').onclick = async ()=>{
    const planId = document.getElementById('planId').value.trim();
    if(!planId){ alert('plan id required'); return }
    try{
      const res = await fetch(API_BASE + '/api/plans/' + encodeURIComponent(planId));
      if(!res.ok){ const err = await res.text(); throw new Error(res.status + ': ' + err) }
      const plan = await res.json();
      const actions = collectActionIds(plan);
      if(!actions.length){
        document.getElementById('planActionsView').innerText = 'No action IDs found in this plan.';
        return;
      }
      document.getElementById('planActionsView').innerText = actions.map(action => `${action.name} [${action.status}] -> ${action.id}`).join('\n');
      document.getElementById('actionId').value = actions[0].id;
      document.getElementById('allocActionId').value = actions[0].id;
    }catch(e){ document.getElementById('planActionsView').innerText = 'Error: ' + e.message }
  };

  async function call(action){
    const id = document.getElementById('actionId').value.trim(); if(!id){ alert('action id required'); return }
    try{
      const res = await fetch(API_BASE + '/api/actions/' + encodeURIComponent(id) + '/' + action, {method:'POST'});
      if(!res.ok){ const err = await res.text(); throw new Error(res.status + ': ' + err) }
      const json = await res.json(); document.getElementById('transitionResult').innerText = JSON.stringify(json,null,2);
    }catch(e){ document.getElementById('transitionResult').innerText = 'Error: '+e.message }
  }
  document.getElementById('submitForApproval').onclick = ()=>call('submit-for-approval');
  document.getElementById('approve').onclick = ()=>call('approve');
  document.getElementById('reject').onclick = ()=>call('reject');
  document.getElementById('resume').onclick = ()=>call('resume');
  document.getElementById('complete').onclick = ()=>call('complete');
  document.getElementById('reopen').onclick = ()=>call('reopen');
  document.getElementById('abandon').onclick = ()=>call('abandon');
  document.getElementById('suspend').onclick = async ()=>{
    const id = document.getElementById('actionId').value.trim(); if(!id){ alert('action id required'); return }
    const reason = prompt('Reason for suspension?') || '';
    try{
      const res = await fetch(API_BASE + '/api/actions/' + encodeURIComponent(id) + '/suspend', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason})});
      if(!res.ok){ const err = await res.text(); throw new Error(res.status + ': ' + err) }
      const json = await res.json(); document.getElementById('transitionResult').innerText = JSON.stringify(json,null,2);
    }catch(e){ document.getElementById('transitionResult').innerText = 'Error: '+e.message }
  };

  document.getElementById('addAlloc').onclick = async ()=>{
    const actionId = document.getElementById('allocActionId').value.trim();
    const resourceTypeId = document.getElementById('resType').value.trim();
    const quantity = Number(document.getElementById('qty').value);
    const kind = document.getElementById('allocKind').value;
    const assetId = document.getElementById('assetId').value.trim()||null;
    const timePeriodStart = document.getElementById('periodStart').value || null;
    const timePeriodEnd = document.getElementById('periodEnd').value || null;
    if(!actionId||!resourceTypeId||!quantity){ alert('action id, resource type and quantity required'); return }
    const body = {resourceTypeId,quantity,kind};
    if(assetId) body.assetId = assetId;
    if(timePeriodStart) body.timePeriodStart = timePeriodStart;
    if(timePeriodEnd) body.timePeriodEnd = timePeriodEnd;
    try{
      console.log('Allocating to action:', actionId, 'with body:', body);
      const res = await fetch(API_BASE + '/api/actions/' + encodeURIComponent(actionId) + '/allocations', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!res.ok){ 
        const err = await res.text(); 
        console.error('Allocation failed:', res.status, err);
        throw new Error('HTTP ' + res.status + ': ' + err) 
      }
      const json = await res.json(); 
      document.getElementById('allocResult').innerText = 'Success! ' + JSON.stringify(json,null,2);
    }catch(e){ 
      console.error('Allocation error:', e);
      document.getElementById('allocResult').innerText = 'Error: '+e.message 
    }
  }
</script>
</body>
</html>
