<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Audit Log</title>
  <style>
    :root{color-scheme:light;--bg:#f3efe7;--panel:#fffaf3;--text:#1f1f1f;--muted:#6b6257;--accent:#145c7a;--accent-2:#d97706;--line:#e7dccb}
    *{box-sizing:border-box}
    body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:linear-gradient(180deg,#efe6d8 0%,#f8f5ef 100%);color:var(--text)}
    header{background:linear-gradient(135deg,#163b4d,#1f6f8b);color:#fff;padding:20px 16px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
    main{padding:16px;max-width:1100px;margin:0 auto}
    .card{background:var(--panel);border:1px solid var(--line);padding:16px;margin:12px 0;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.05)}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    button{padding:10px 14px;background:var(--accent);color:#fff;border:0;border-radius:10px;cursor:pointer;font-weight:700}
    pre{background:#fff;border:1px solid var(--line);padding:12px;border-radius:12px;overflow:auto;max-height:60vh}
    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid #efe4d6;padding:10px 8px;text-align:left;vertical-align:top}
    th{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    .status{margin-top:10px;color:var(--muted)}
    a{color:var(--accent)}
  </style>
</head>
<body>
<header><h2 style="margin:0">Audit Log</h2></header>
<main>
  <section class="card">
    <div class="toolbar">
      <button id="load">Load</button>
      <div class="status">Asset utilisation rows include asset ID and hours used.</div>
    </div>
    <pre id="view"></pre>
  </section>
  <a href="index.html">Back</a>
</main>
<script>
  const API_BASE = 'https://resource-planning-part2-latest.onrender.com';
  document.getElementById('load').onclick = async ()=>{
    try{
      const res = await fetch(API_BASE + '/api/audit-log');
      if(!res.ok){ const err = await res.text(); throw new Error(res.status + ': ' + err) }
      const data = await res.json();
      document.getElementById('view').innerHTML = '<table><thead><tr><th>Event</th><th>Action ID</th><th>Asset ID</th><th>Hours Used</th><th>Timestamp</th></tr></thead><tbody>' + data.map(entry => `<tr><td>${entry.event||''}</td><td>${entry.actionId||''}</td><td>${entry.assetId||''}</td><td>${entry.hoursUsed ?? ''}</td><td>${entry.timestamp||''}</td></tr>`).join('') + '</tbody></table>';
    }catch(e){
      document.getElementById('view').innerText = 'Error: ' + e.message
    }
  }
</script>
</body>
</html>
