<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Resource Types</title>
  <style>
    :root{color-scheme:light;--bg:#f3efe7;--panel:#fffaf3;--text:#1f1f1f;--muted:#6b6257;--accent:#145c7a;--accent-2:#d97706;--line:#e7dccb}
    *{box-sizing:border-box}
    body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:0;background:linear-gradient(180deg,#efe6d8 0%,#f8f5ef 100%);color:var(--text)}
    header{background:linear-gradient(135deg,#163b4d,#1f6f8b);color:#fff;padding:20px 16px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
    main{padding:16px;max-width:1100px;margin:0 auto}
    .card{background:var(--panel);border:1px solid var(--line);padding:16px;margin:12px 0;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.05)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
    label{display:block;font-size:14px;font-weight:700;color:var(--muted)}
    input,select{width:100%;padding:10px 12px;margin-top:6px;border:1px solid #d8cbb8;border-radius:10px;background:#fff}
    button{padding:10px 14px;background:var(--accent);color:#fff;border:0;border-radius:10px;cursor:pointer;font-weight:700}
    button.secondary{background:var(--accent-2)}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    table{width:100%;border-collapse:collapse;overflow:hidden}
    th,td{border-bottom:1px solid #efe4d6;padding:10px 8px;text-align:left;vertical-align:top}
    th{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    tr:hover td{background:#fffdf8}
    .status{margin-top:10px;color:var(--muted)}
    a{color:var(--accent)}
  </style>
</head>
<body>
<header><h2 style="margin:0">Resource Types</h2></header>
<main>
  <section class="card">
    <div class="grid">
      <label>Name <input id="name" placeholder="e.g. Hourly Camera"></label>
      <label>Kind <select id="kind"><option value="CONSUMABLE">CONSUMABLE</option><option value="ASSET">ASSET</option></select></label>
      <label>Unit <input id="unit" placeholder="e.g. hours, liters"></label>
      <label>Unit Cost <input id="unitCost" type="number" step="0.01" min="0" placeholder="Optional"></label>
    </div>
    <div class="toolbar" style="margin-top:12px">
      <button id="createBtn">Create</button>
      <div id="createResult" class="status"></div>
    </div>
  </section>

  <section class="card">
    <div class="toolbar">
      <button id="refreshBtn" class="secondary">Refresh</button>
      <div class="status">Unit cost is optional and shown for asset pricing.</div>
    </div>
    <table>
      <thead><tr><th>Name</th><th>Kind</th><th>Unit</th><th>Unit Cost</th><th>Pool Account ID</th><th>Pool Balance</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
  <a href="index.html">Back</a>
</main>
<script>
  const API_BASE = 'https://resource-planning-part2-latest.onrender.com';
  async function list(){
    const rows = document.getElementById('rows'); rows.innerHTML='';
    try{
      const res = await fetch(API_BASE + '/api/resource-types');
      const data = await res.json();
      data.forEach(r=>{
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${r.name}</td><td>${r.kind}</td><td>${r.unitOfMeasure||r.unit||''}</td><td>${r.unitCost ?? ''}</td><td>${r.poolAccountId||''}</td><td>${r.currentBalance??0}</td>`;
        rows.appendChild(tr);
      })
    }catch(e){ rows.innerHTML = '<tr><td colspan="6">Error: '+e.message+'</td></tr>' }
  }
  document.getElementById('refreshBtn').onclick = list;
  document.getElementById('createBtn').onclick = async ()=>{
    const name = document.getElementById('name').value.trim();
    const kind = document.getElementById('kind').value;
    const unit = document.getElementById('unit').value.trim();
    const unitCostRaw = document.getElementById('unitCost').value.trim();
    if(!name){ alert('Name required'); return }
    try{
      const body = {name,kind,unitOfMeasure:unit};
      if(unitCostRaw !== '') body.unitCost = Number(unitCostRaw);
      const res = await fetch(API_BASE + '/api/resource-types', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!res.ok){ const err = await res.text(); throw new Error(res.status + ': ' + err) }
      const json = await res.json();
      document.getElementById('createResult').innerText = 'Created: '+json.id;
      list();
    }catch(e){ document.getElementById('createResult').innerText = 'Error: '+e.message }
  }
  list();
</script>
</body>
</html>
